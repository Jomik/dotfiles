# ==============================================================================
# Shell
# ==============================================================================
shell               /opt/homebrew/bin/fish
macos_option_as_alt yes

# ==============================================================================
# Theme (change with: kitten themes)
# ==============================================================================
include current-theme.conf

# ==============================================================================
# Herdr
# ==============================================================================
startup_session ~/.config/kitty/sessions/herdr.kitty-session

# Herdr owns mouse selection, so Kitty must forward explicit copy.
map cmd+c no_op

# Avoid creating a second tab layer outside Herdr.
map cmd+t discard_event

# Open visible URLs with keyboard hints.
map ctrl+shift+e open_url_with_hints

# ==============================================================================
# Misc
# ==============================================================================
copy_on_select    no
enable_audio_bell no
visual_bell_duration 0.1

# BEGIN_KITTY_FONTS
font_family      family='IosevkaTerm Nerd Font Mono' postscript_name=IosevkaTermNFM
font_size        16
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
